[project]
name = "hyperlimit"
version = "0.1.0"
description = "Adaptive (AIMD) concurrency limiter for asyncio: probe upward while work succeeds, back off sharply on throttle signals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyperlimit"]
